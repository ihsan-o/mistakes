<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤪 Ultimate Mistake Leaderboard 🏆</title>
    
    <!-- Firebase SDK (v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAGFNly3GoHtX_dftyae7PmEIxqMPWJv1Y",
            authDomain: "mistakesoffikra.firebaseapp.com",
            projectId: "mistakesoffikra",
            storageBucket: "mistakesoffikra.firebasestorage.app",
            messagingSenderId: "1066736144095",
            appId: "1:1066736144095:web:e739f21fe017cdda4fa36a",
            measurementId: "G-HGY8ZZRW2M"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let isAdmin = localStorage.getItem('isAdmin') === 'true';
        let globalMistakes = [];
        let globalScores = {};
        let globalWeekly = {};
        let selectedFilterName = null; // Filter for specific person

        window.addEventListener('DOMContentLoaded', () => {
            if (isAdmin) {
                document.getElementById('adminSection').style.display = 'block';
                document.getElementById('loginBox').style.display = 'none';
            }
            fetchData();
        });

        window.loginAdmin = function() {
            const u = document.getElementById('adminUser').value.trim();
            const p = document.getElementById('adminPass').value.trim();

            if (u === "admin" && p === "fymin@2297121_") {
                isAdmin = true;
                localStorage.setItem('isAdmin', 'true');
                document.getElementById('adminSection').style.display = 'block';
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('adminUser').value = "";
                document.getElementById('adminPass').value = "";
                alert("🎉 Welcome Boss! Ready to roast?");
                renderUI();
            } else {
                alert("❌ Wrong password! Try again buddy.");
            }
        };

        window.logoutAdmin = function() {
            isAdmin = false;
            localStorage.setItem('isAdmin', 'false');
            document.getElementById('adminSection').style.display = 'none';
            document.getElementById('loginBox').style.display = 'block';
            alert("👋 Logged out safely!");
            renderUI();
        };

        window.addMistake = async function() {
            if (!isAdmin) {
                alert("Nice try! Only the admin can roast here 🛑");
                return;
            }

            const name = document.getElementById('personName').value.trim();
            const mistake = document.getElementById('mistakeText').value.trim();
            const real = document.getElementById('realText').value.trim();

            if (name === "" || mistake === "" || real === "") {
                alert("⚠️ Ellam fill cheyyuvaa, ennale roast kollu!");
                return;
            }

            try {
                await addDoc(collection(db, "mistakes"), {
                    name: name,
                    mistake: mistake,
                    real: real,
                    timestamp: Date.now()
                });

                document.getElementById('personName').value = "";
                document.getElementById('mistakeText').value = "";
                document.getElementById('realText').value = "";
                alert("🔥 Roast successfully posted to the hall of fame!");
            } catch (e) {
                console.error("Error adding document: ", e);
                alert("Error posting mistake!");
            }
        };

        window.deleteMistake = async function(id) {
            if (!isAdmin) return;

            if (confirm("🗑️ Ithu delete cheyyanam enn urappano?")) {
                try {
                    await deleteDoc(doc(db, "mistakes", id));
                } catch (e) {
                    console.error("Error deleting document: ", e);
                }
            }
        };

        // Filter mistakes when clicking a person's name on leaderboard
        window.filterByPerson = function(name) {
            if (selectedFilterName === name) {
                selectedFilterName = null; // Toggle off if already selected
                document.getElementById('resetFilterBtn').style.display = 'none';
            } else {
                selectedFilterName = name;
                document.getElementById('resetFilterBtn').style.display = 'inline-block';
            }
            renderUI();
        };

        window.resetFilter = function() {
            selectedFilterName = null;
            document.getElementById('resetFilterBtn').style.display = 'none';
            renderUI();
        };

        function fetchData() {
            onSnapshot(collection(db, "mistakes"), (snapshot) => {
                globalMistakes = [];
                globalScores = {};
                globalWeekly = {};

                const oneWeekAgo = Date.now() - (7 * 24 * 60 * 60 * 1000);

                snapshot.forEach((document) => {
                    const data = document.data();
                    globalMistakes.push({ id: document.id, ...data });
                    
                    globalScores[data.name] = (globalScores[data.name] || 0) + 1;

                    if (data.timestamp >= oneWeekAgo) {
                        globalWeekly[data.name] = (globalWeekly[data.name] || 0) + 1;
                    }
                });

                globalMistakes.sort((a, b) => b.timestamp - a.timestamp);
                renderUI();
            });
        }

        function renderUI() {
            // Mistakes List Render
            const mistakeListUl = document.getElementById('mistakeList');
            mistakeListUl.innerHTML = "";
            
            // Filter mistakes if a specific person is clicked
            const filteredMistakes = selectedFilterName 
                ? globalMistakes.filter(item => item.name === selectedFilterName)
                : globalMistakes;

            if (filteredMistakes.length === 0) {
                mistakeListUl.innerHTML = `<li style="text-align:center; color:#94a3b8;">No mistakes found for this person!</li>`;
            } else {
                filteredMistakes.forEach(item => {
                    const li = document.createElement('li');
                    
                    let deleteBtnHtml = "";
                    if (isAdmin) {
                        deleteBtnHtml = `<button onclick="deleteMistake('${item.id}')" class="delete-btn">🗑️ Delete</button>`;
                    }

                    li.innerHTML = `<strong>👤 ${item.name}</strong><br>
                                    ❌ <em>Mistake:</em> ${item.mistake}<br>
                                    <div class="real-fact">✅ <em>Real Fact:</em> ${item.real}</div>
                                    ${deleteBtnHtml}`;
                    mistakeListUl.appendChild(li);
                });
            }

            // Weekly Winner Banner
            const weeklyWinnerCard = document.getElementById('weeklyWinnerCard');
            const sortedWeekly = Object.entries(globalWeekly).sort((a, b) => b[1] - a[1]);

            if (sortedWeekly.length > 0) {
                const [topWeeklyName, topWeeklyCount] = sortedWeekly[0];
                weeklyWinnerCard.innerHTML = `🔥 <strong>${topWeeklyName}</strong> is leading this week with <strong>${topWeeklyCount} blunders</strong>! 🤡`;
                weeklyWinnerCard.style.display = "block";
            } else {
                weeklyWinnerCard.style.display = "none";
            }

            // Leaderboard Render
            const leaderboardUl = document.getElementById('leaderboardList');
            leaderboardUl.innerHTML = "";
            
            const sortedScores = Object.entries(globalScores).sort((a, b) => b[1] - a[1]);

            sortedScores.forEach(([name, count], index) => {
                const li = document.createElement('li');
                li.className = "leaderboard-item";
                
                if (index === 0) li.classList.add('rank-1');
                if (selectedFilterName === name) li.style.border = "2px solid #8b5cf6";

                let rankBadge = `#${index + 1}`;
                if (index === 0) rankBadge = "🥇 1st (Legend)";
                else if (index === 1) rankBadge = "🥈 2nd";
                else if (index === 2) rankBadge = "🥉 3rd";

                let titleTag = count > 3 ? "🔥 Pro Blunderer" : "🐣 Rookie";

                li.innerHTML = `<span onclick="filterByPerson('${name}')" style="cursor:pointer;" title="Click to view mistakes"><strong>${rankBadge} &nbsp; ${name}</strong> <span style="font-size:11px; color:#94a3b8;">(${titleTag}) 🔍</span></span> <span><strong>${count} mistakes</strong></span>`;
                leaderboardUl.appendChild(li);
            });
        }
    </script>

    <style>
        :root {
            --bg-color: #090d16;
            --card-bg: #111827;
            --text-color: #f8fafc;
            --primary: #8b5cf6;
            --primary-hover: #7c3aed;
            --border: #1f2937;
            --mistake-bg: #1f1d24;
            --mistake-border: #f43f5e;
            --real-bg: #064e3b55;
            --real-text: #34d399;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-color); 
            margin: 0; 
            padding: 20px; 
            color: var(--text-color); 
        }
        
        .container { 
            max-width: 600px; 
            margin: auto; 
            background: var(--card-bg); 
            padding: 25px; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.15); 
            border: 1px solid var(--border);
        }

        h2 { 
            color: #c084fc; 
            text-align: center; 
            font-size: 26px;
            text-shadow: 0 0 15px rgba(192, 132, 252, 0.4);
        }

        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border);
            padding-bottom: 5px;
            margin-top: 25px;
        }

        h3 {
            color: #a78bfa;
            margin: 0;
        }

        .reset-btn {
            background: #374151;
            color: #f8fafc;
            border: none;
            padding: 4px 10px;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
            display: none;
        }
        .reset-btn:hover {
            background: #4b5563;
        }

        .weekly-banner {
            background: linear-gradient(135deg, #f59e0b, #ef4444);
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-size: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
            display: none;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        input, textarea { 
            width: 100%; 
            padding: 12px; 
            margin: 8px 0; 
            background: #1f2937;
            border: 1px solid var(--border); 
            color: var(--text-color);
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 14px;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 8px rgba(139, 92, 246, 0.4);
        }

        button { 
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            color: white; 
            padding: 12px; 
            border: none; 
            width: 100%; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: 600;
            transition: transform 0.1s, opacity 0.2s;
            margin-top: 5px;
        }

        button:hover { 
            opacity: 0.9;
            transform: scale(1.01);
        }

        ul { 
            list-style-type: none; 
            padding: 0; 
        }

        li { 
            background: #1a2234; 
            margin: 12px 0; 
            padding: 15px; 
            border-left: 5px solid #f43f5e; 
            border-radius: 8px; 
            font-size: 14px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .real-fact { 
            color: var(--real-text); 
            font-size: 13px; 
            margin-top: 8px; 
            background: var(--real-bg); 
            padding: 8px 10px; 
            border-radius: 6px; 
            border: 1px solid #065f46;
        }

        .leaderboard-item { 
            background: #1f2937; 
            border-left: 5px solid #10b981; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            padding: 12px 15px; 
            margin: 8px 0;
            border-radius: 8px;
            transition: background 0.2s;
        }
        .leaderboard-item:hover {
            background: #252f3f;
        }

        .rank-1 {
            background: linear-gradient(90deg, #371d38, #1f2937) !important;
            border-left: 5px solid #f59e0b !important;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.2);
        }
        
        #adminSection { 
            display: none; 
            background: #1a2234; 
            padding: 20px; 
            border-radius: 12px; 
            margin-bottom: 25px; 
            border: 1px dashed #8b5cf6; 
        }

        .login-box { 
            background: #1a2234; 
            padding: 20px; 
            border-radius: 12px; 
            margin-bottom: 25px; 
            border: 1px solid var(--border);
        }

        .logout-btn { 
            background: linear-gradient(135deg, #ef4444, #dc2626); 
            margin-top: 15px; 
        }

        .delete-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            width: auto;
        }
        .delete-btn:hover {
            background: #dc2626;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🤪 Hall of Blunders 🏆</h2>

    <!-- Weekly Winner Banner -->
    <div id="weeklyWinnerCard" class="weekly-banner"></div>

    <!-- Login Box -->
    <div id5="loginBox" class="login-box">
        <h3>🔒 Admin Login</h3>
        <input type="text" id="adminUser" placeholder="Admin Name">
        <input type="password" id="adminPass" placeholder="Password">
        <button onclick="loginAdmin()">Login to Roast</button>
    </div>

    <!-- Admin Panel -->
    <div id="adminSection">
        <h3>✨ Drop a New Mistake (Admin Panel)</h3>
        <input type="text" id="personName" placeholder="Who said it? (Name)">
        <textarea id="mistakeText" placeholder="❌ What did they say? (The Blunder)"></textarea>
        <textarea id="realText" placeholder="✅ What is the actual fact?"></textarea>
        <button onclick="addMistake()">🚀 Post Roast</button>
        <button class="logout-btn" onclick="logoutAdmin()">Logout</button>
    </div>

    <!-- Leaderboard Scoreboard -->
    <h3>👑 Leaderboard (Top Blunderers)</h3>
    <p style="font-size: 12px; color: #94a3b8; text-align: center; margin-top: 5px;">👆 Click on any person's name to view only their mistakes!</p>
    <ul id="leaderboardList"></ul>

    <!-- Mistakes List with Reset Filter Button -->
    <div class="header-flex">
        <h3>📜 Roasts & Reality Checks</h3>
        <button id="resetFilterBtn" class="reset-btn" onclick="resetFilter()">Show All 🔄</button>
    </div>
    <ul id="mistakeList"></ul>
</div>

</body>
</html>
