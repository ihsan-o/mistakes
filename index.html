<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mistake Leaderboard 🏆</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --border: #334155;
            --mistake-bg: #331f24;
            --mistake-border: #f43f5e;
            --real-bg: #14352c;
            --real-text: #34d399;
            --leaderboard-bg: #1e293b;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-color); 
            margin: 0; 
            padding: 20px; 
            color: var(--text-color); 
        }
        
        .container { 
            max-width: 600px; 
            margin: auto; 
            background: var(--card-bg); 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); 
            border: 1px solid var(--border);
        }

        h2, h3 { 
            color: #818cf8; 
            text-align: center; 
            margin-top: 10px;
        }

        input, textarea { 
            width: 100%; 
            padding: 12px; 
            margin: 8px 0; 
            background: #0f172a;
            border: 1px solid var(--border); 
            color: var(--text-color);
            border-radius: 6px; 
            box-sizing: border-box; 
            font-size: 14px;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        button { 
            background-color: var(--primary); 
            color: white; 
            padding: 12px; 
            border: none; 
            width: 100%; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: 600;
            transition: background 0.2s;
            margin-top: 5px;
        }

        button:hover { 
            background-color: var(--primary-hover); 
        }

        ul { 
            list-style-type: none; 
            padding: 0; 
        }

        li { 
            background: var(--mistake-bg); 
            margin: 12px 0; 
            padding: 15px; 
            border-left: 5px solid var(--mistake-border); 
            border-radius: 6px; 
            font-size: 14px;
        }

        .real-fact { 
            color: var(--real-text); 
            font-size: 13px; 
            margin-top: 8px; 
            background: var(--real-bg); 
            padding: 8px 10px; 
            border-radius: 4px; 
        }

        .leaderboard-item { 
            background: #111827; 
            border-left: 5px solid #10b981; 
            display: flex; 
            justify-content: space-between; 
            padding: 12px 15px; 
            margin: 8px 0;
            border-radius: 6px;
        }
        
        #adminSection { 
            display: none; 
            background: #111827; 
            padding: 20px; 
            border-radius: 8px; 
            margin-bottom: 25px; 
            border: 1px dashed #6366f1; 
        }

        .login-box { 
            background: #111827; 
            padding: 20px; 
            border-radius: 8px; 
            margin-bottom: 25px; 
            border: 1px solid var(--border);
        }

        .logout-btn { 
            background-color: #ef4444; 
            margin-top: 15px; 
        }
        .logout-btn:hover { 
            background-color: #dc2626; 
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🤪 Mistake Leaderboard 🏆</h2>

    <!-- Login Box -->
    <div id="loginBox" class="login-box">
        <h3>🔒 Admin Login</h3>
        <input type="text" id="adminUser" placeholder="Admin Name">
        <input type="password" id="adminPass" placeholder="Password">
        <button onclick="loginAdmin()">Login</button>
    </div>

    <!-- Admin Panel -->
    <div id="adminSection">
        <h3>✨ Add New Mistake (Admin Panel)</h3>
        <input type="text" id="personName" placeholder="Who said it? (Name)">
        <textarea id="mistakeText" placeholder="❌ What was the mistake?"></textarea>
        <textarea id="realText" placeholder="✅ What is the real fact?"></textarea>
        <button onclick="addMistake()">Post Mistake</button>
        <button class="logout-btn" onclick="logoutAdmin()">Logout</button>
    </div>

    <!-- Leaderboard Section -->
    <h3>👑 Leaderboard (Top Mistakes)</h3>
    <ul id="leaderboardList"></ul>

    <!-- Mistakes List -->
    <h3>📜 Mistakes & Real Facts</h3>
    <ul id="mistakeList"></ul>
</div>

<script>
    let mistakes = JSON.parse(localStorage.getItem('mistakes')) || [];
    let scores = JSON.parse(localStorage.getItem('scores')) || {};
    let isAdmin = localStorage.getItem('isAdmin') === 'true';

    window.onload = function() {
        if (isAdmin) {
            document.getElementById('adminSection').style.display = 'block';
            document.getElementById('loginBox').style.display = 'none';
        }
        updateUI();
    };

    function loginAdmin() {
        const u = document.getElementById('adminUser').value.trim();
        const p = document.getElementById('adminPass').value.trim();

        if (u === "admin" && p === "fymin@2297121_") {
            isAdmin = true;
            localStorage.setItem('isAdmin', 'true');
            document.getElementById('adminSection').style.display = 'block';
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('adminUser').value = "";
            document.getElementById('adminPass').value = "";
            alert("Login Successful!");
        } else {
            alert("Invalid Username or Password!");
        }
    }

    function logoutAdmin() {
        isAdmin = false;
        localStorage.setItem('isAdmin', 'false');
        document.getElementById('adminSection').style.display = 'none';
        document.getElementById('loginBox').style.display = 'block';
        alert("Logged out successfully!");
    }

    function addMistake() {
        if (!isAdmin) {
            alert("You don't have permission!");
            return;
        }

        const name = document.getElementById('personName').value.trim();
        const mistake = document.getElementById('mistakeText').value.trim();
        const real = document.getElementById('realText').value.trim();

        if (name === "" || mistake === "" || real === "") {
            alert("Please fill in all fields!");
            return;
        }

        mistakes.push({ name, mistake, real });
        scores[name] = (scores[name] || 0) + 1;

        localStorage.setItem('mistakes', JSON.stringify(mistakes));
        localStorage.setItem('scores', JSON.stringify(scores));

        document.getElementById('personName').value = "";
        document.getElementById('mistakeText').value = "";
        document.getElementById('realText').value = "";

        updateUI();
    }

    function updateUI() {
        const mistakeListUl = document.getElementById('mistakeList');
        mistakeListUl.innerHTML = "";
        mistakes.forEach(item => {
            const li = document.createElement('li');
            li.innerHTML = `<strong>👤 ${item.name}</strong><br>
                            ❌ <em>Mistake:</em> ${item.mistake}<br>
                            <div class="real-fact">✅ <em>Real Fact:</em> ${item.real}</div>`;
            mistakeListUl.appendChild(li);
        });

        const leaderboardUl = document.getElementById('leaderboardList');
        leaderboardUl.innerHTML = "";
        
        const sortedScores = Object.entries(scores).sort((a, b) => b[1] - a[1]);

        sortedScores.forEach(([name, count]) => {
            const li = document.createElement('li');
            li.className = "leaderboard-item";
            li.innerHTML = `<span><strong>${name}</strong></span> <span><strong>${count} mistakes</strong></span>`;
            leaderboardUl.appendChild(li);
        });
    }
</script>

</body>
</html>
