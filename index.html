<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mistake Leaderboard 🏆</title>
    
    <!-- Firebase SDK (v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAGFNly3GoHtX_dftyae7PmEIxqMPWJv1Y",
            authDomain: "mistakesoffikra.firebaseapp.com",
            projectId: "mistakesoffikra",
            storageBucket: "mistakesoffikra.firebasestorage.app",
            messagingSenderId: "1066736144095",
            appId: "1:1066736144095:web:e739f21fe017cdda4fa36a",
            measurementId: "G-HGY8ZZRW2M"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let isAdmin = localStorage.getItem('isAdmin') === 'true';

        window.addEventListener('DOMContentLoaded', () => {
            if (isAdmin) {
                document.getElementById('adminSection').style.display = 'block';
                document.getElementById('loginBox').style.display = 'none';
            }
            fetchData();
        });

        window.loginAdmin = function() {
            const u = document.getElementById('adminUser').value.trim();
            const p = document.getElementById('adminPass').value.trim();

            if (u === "admin" && p === "fymin@2297121_") {
                isAdmin = true;
                localStorage.setItem('isAdmin', 'true');
                document.getElementById('adminSection').style.display = 'block';
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('adminUser').value = "";
                document.getElementById('adminPass').value = "";
                alert("Login Successful!");
                fetchData();
            } else {
                alert("Invalid Username or Password!");
            }
        };

        window.logoutAdmin = function() {
            isAdmin = false;
            localStorage.setItem('isAdmin', 'false');
            document.getElementById('adminSection').style.display = 'none';
            document.getElementById('loginBox').style.display = 'block';
            alert("Logged out successfully!");
            fetchData();
        };

        window.addMistake = async function() {
            if (!isAdmin) {
                alert("You don't have permission!");
                return;
            }

            const name = document.getElementById('personName').value.trim();
            const mistake = document.getElementById('mistakeText').value.trim();
            const real = document.getElementById('realText').value.trim();

            if (name === "" || mistake === "" || real === "") {
                alert("Please fill in all fields!");
                return;
            }

            try {
                await addDoc(collection(db, "mistakes"), {
                    name: name,
                    mistake: mistake,
                    real: real,
                    timestamp: Date.now()
                });

                document.getElementById('personName').value = "";
                document.getElementById('mistakeText').value = "";
                document.getElementById('realText').value = "";
                alert("Mistake posted successfully!");
            } catch (e) {
                console.error("Error adding document: ", e);
                alert("Error posting mistake!");
            }
        };

        window.deleteMistake = async function(id) {
            if (!isAdmin) {
                alert("You don't have permission!");
                return;
            }

            if (confirm("Are you sure you want to delete this mistake?")) {
                try {
                    await deleteDoc(doc(db, "mistakes", id));
                    alert("Mistake deleted successfully!");
                } catch (e) {
                    console.error("Error deleting document: ", e);
                    alert("Error deleting mistake!");
                }
            }
        };

        function fetchData() {
            onSnapshot(collection(db, "mistakes"), (snapshot) => {
                let mistakes = [];
                let scores = {};

                snapshot.forEach((document) => {
                    const data = document.data();
                    mistakes.push({ id: document.id, ...data });
                    scores[data.name] = (scores[data.name] || 0) + 1;
                });

                mistakes.sort((a, b) => b.timestamp - a.timestamp);

                updateUI(mistakes, scores);
            });
        }

        function updateUI(mistakes, scores) {
            const mistakeListUl = document.getElementById('mistakeList');
            mistakeListUl.innerHTML = "";
            
            mistakes.forEach(item => {
                const li = document.createElement('li');
                
                let deleteBtnHtml = "";
                if (isAdmin) {
                    deleteBtnHtml = `<button onclick="deleteMistake('${item.id}')" class="delete-btn">Delete</button>`;
                }

                li.innerHTML = `<strong>👤 ${item.name}</strong><br>
                                ❌ <em>Mistake:</em> ${item.mistake}<br>
                                <div class="real-fact">✅ <em>Real Fact:</em> ${item.real}</div>
                                ${deleteBtnHtml}`;
                mistakeListUl.appendChild(li);
            });

            const leaderboardUl = document.getElementById('leaderboardList');
            leaderboardUl.innerHTML = "";
            
            const sortedScores = Object.entries(scores).sort((a, b) => b[1] - a[1]);

            sortedScores.forEach(([name, count], index) => {
                const li = document.createElement('li');
                li.className = "leaderboard-item";
                
                let rankBadge = `#${index + 1}`;
                if (index === 0) rankBadge = "🥇 1st";
                else if (index === 1) rankBadge = "🥈 2nd";
                else if (index === 2) rankBadge = "🥉 3rd";

                li.innerHTML = `<span><strong>${rankBadge} &nbsp; ${name}</strong></span> <span><strong>${count} mistakes</strong></span>`;
                leaderboardUl.appendChild(li);
            });
        }
    </script>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --border: #334155;
            --mistake-bg: #331f24;
            --mistake-border: #f43f5e;
            --real-bg: #14352c;
            --real-text: #34d399;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-color); 
            margin: 0; 
            padding: 20px; 
            color: var(--text-color); 
        }
        
        .container { 
            max-width: 600px; 
            margin: auto; 
            background: var(--card-bg); 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); 
            border: 1px solid var(--border);
        }

        h2, h3 { 
            color: #818cf8; 
            text-align: center; 
            margin-top: 10px;
        }

        input, textarea { 
            width: 100%; 
            padding: 12px; 
            margin: 8px 0; 
            background: #0f172a;
            border: 1px solid var(--border); 
            color: var(--text-color);
            border-radius: 6px; 
            box-sizing: border-box; 
            font-size: 14px;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        button { 
            background-color: var(--primary); 
            color: white; 
            padding: 12px; 
            border: none; 
            width: 100%; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: 600;
            transition: background 0.2s;
            margin-top: 5px;
        }

        button:hover { 
            background-color: var(--primary-hover); 
        }

        ul { 
            list-style-type: none; 
            padding: 0; 
        }

        li { 
            background: var(--mistake-bg); 
            margin: 12px 0; 
            padding: 15px; 
            border-left: 5px solid var(--mistake-border); 
            border-radius: 6px; 
            font-size: 14px;
        }

        .real-fact { 
            color: var(--real-text); 
            font-size: 13px; 
            margin-top: 8px; 
            background: var(--real-bg); 
            padding: 8px 10px; 
            border-radius: 4px; 
        }

        .leaderboard-item { 
            background: #111827; 
            border-left: 5px solid #10b981; 
            display: flex; 
            justify-content: space-between; 
            padding: 12px 15mm 12px 15px; 
            margin: 8px 0;
            border-radius: 6px;
        }
        
        #adminSection { 
            display: none; 
            background: #111827; 
            padding: 20px; 
            border-radius: 8px; 
            margin-bottom: 25px; 
            border: 1px dashed #6366f1; 
        }

        .login-box { 
            background: #111827; 
            padding: 20px; 
            border-radius: 8px; 
            margin-bottom: 25px; 
            border: 1px solid var(--border);
        }

        .logout-btn { 
            background-color: #ef4444; 
            margin-top: 15px; 
        }
        .logout-btn:hover { 
            background-color: #dc2626; 
        }

        .delete-btn {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 5px 10px;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
            width: auto;
        }
        .delete-btn:hover {
            background-color: #dc2626;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🤪 Mistake Leaderboard 🏆</h2>

    <!-- Login Box -->
    <div id="loginBox" class="login-box">
        <h3>🔒 Admin Login</h3>
        <input type="text" id="adminUser" placeholder="Admin Name">
        <input type="password" id="adminPass" placeholder="Password">
        <button onclick="loginAdmin()">Login</button>
    </div>

    <!-- Admin Panel -->
    <div id="adminSection">
        <h3>✨ Add New Mistake (Admin Panel)</h3>
        <input type="text" id="personName" placeholder="Who said it? (Name)">
        <textarea id="mistakeText" placeholder="❌ What was the mistake?"></textarea>
        <textarea id="realText" placeholder="✅ What is the real fact?"></textarea>
        <button onclick="addMistake()">Post Mistake</button>
        <button class="logout-btn" onclick="logoutAdmin()">Logout</button>
    </div>

    <!-- Leaderboard Scoreboard -->
    <h3>👑 Leaderboard (Top Mistakes)</h3>
    <ul id="leaderboardList"></ul>

    <!-- Mistakes List -->
    <h3>📜 Mistakes & Real Facts</h3>
    <ul id="mistakeList"></ul>
</div>

</body>
</html>
